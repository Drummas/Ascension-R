# Makes a GitHub release when a commit message starts with "Release: v<version>" (CupOfTea696/gh-action-auto-release,
# the Auto Release action), and puts the same files on it as every release before: the Kit zip, audit.txt, the two
# maps and FFmpeg's source, as `gowa.py package kit` makes them in dist/<version>/kit.
#
# The version the commit message names must be the one port/version.h has: the package is named from that file, and a
# release names the package it builds. Add the version's entry to CHANGELOG.md with the release commit: the release's
# notes are that section, and its versions are the file's top-level headings (see the notes step below).
#
# A manual run (Actions > Release > Run workflow) has no commit message to read: `release` on makes the release for the
# commit from port/version.h, and off only builds and packages, to check that it would. `release` is the one input,
# and it decides whether a release is made.
#
# The package is built on Windows with the game's own copy and the SDKs gowa.py takes (the game at vfs\PS3_GAME,
# GOWA_GAME_DIR or GOWA_ELF, FSR, Streamline, SDL3, a release FFmpeg): that is the machine a release has always been
# made on, because the exe is compiled from the code the lifter writes out of the game's own GOWA.elf, which the
# repository does not carry. Set the repository variable RELEASE_RUNNER (Settings > Variables) to such a runner's
# labels, e.g. "self-hosted, windows, x64", and GOWA_GAME_DIR to the installed game's folder (GOWA_ELF to just the
# decrypted ELF): a fresh checkout has neither vfs\ nor recompiled\. Without them the job runs on windows-latest and
# stops at the check below, saying what it needs.
#
# The release is made as a draft and published only once its files are on it: a run that cannot lift the game or
# build the exe leaves a draft, never a public release page with nothing to download.
#
# One token, GITHUB_TOKEN: it is the name the auto-release action reads (it stops with "The GITHUB_TOKEN environment
# variable was not set" without it), and gh reads GITHUB_TOKEN too when GH_TOKEN is not set
# (https://cli.github.com/manual/gh_help_environment), so the gh commands of the publish job authenticate with it.
name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: "Create a release for this commit (off: only build the package)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: A commit message says release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      released: ${{ steps.notes.outputs.released }}
      version: ${{ steps.notes.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The commit message is the trigger: "Release: v0.4.1" (or "...0.4.1", or with a note after it). Every other
      # commit passes through with nothing made.
      - name: The release, if the commit message says so
        id: auto-release
        # A release that exists already is not made a second time: the notes below refresh it instead, so another
        # Release: commit for a version repairs its page rather than stopping the job with a red X.
        continue-on-error: true
        uses: CupOfTea696/gh-action-auto-release@a8f57f49a805d334ac7abe31b689e7ea24e1ee40 # v1.0.2
        with:
          title: "Ascension-R v$semver: God of War: Ascension PC port"
          tag: "v$semver"
          draft: true
          changelog: CHANGELOG.md
          changelog-entry: "$semver"
          regex: "/^Release: v?#{semver}\\b/i"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The notes a release page shows are the version's own section of CHANGELOG.md, as that section stands at this
      # commit: the action writes them once, and this keeps the page saying what the file says when the section is
      # edited or a second Release: commit asks for the version again.
      #
      # The versions are the file's top-level headings, with no title above them: the action splits the file at its
      # headings and nests a version under any shallower heading, so a "# Changelog" title would make the notes the
      # whole file.
      - name: The release's notes are the changelog's
        id: notes
        if: >-
          always() && !cancelled() &&
          (steps.auto-release.outputs.released == 'true' || steps.auto-release.outcome == 'failure')
        shell: bash
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$MESSAGE" | head -1 | grep -qiE '^Release: v?[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "The commit message says nothing about a release: nothing to refresh."
            exit 0
          fi
          tag="v$(sed -n 's/^#define[[:space:]]*AR_VERSION[[:space:]]*"\(.*\)"/\1/p' port/version.h)"
          if [ -z "${tag#v}" ]; then echo "::error::port/version.h has no AR_VERSION"; exit 1; fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag is not a release, and the action did not make one (${{ steps.auto-release.outcome }})."
            exit 1
          fi
          awk -v v="$tag" '/^## /{on = ($2 == v); next} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no \"## $tag\" section: the release's notes would be empty."
            exit 1
          fi
          gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          echo "The notes of $tag are the changelog's section for it."
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  publish:
    name: The package, on the release
    needs: release
    # A skipped release job (a manual run) leaves no outputs: the input decides there, the action's output on a push.
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'workflow_dispatch' && inputs.release) ||
       (github.event_name == 'push' && needs.release.outputs.released == 'true'))
    # The release machine: a Windows with the game's copy and the SDKs, as every release has been packaged on.
    runs-on: ${{ vars.RELEASE_RUNNER || 'windows-latest' }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The release machine's game, outside the checkout: actions/checkout wipes vfs\ and recompiled\ from it.
      GOWA_ELF: ${{ vars.GOWA_ELF }}
      GOWA_GAME_DIR: ${{ vars.GOWA_GAME_DIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # The image's MSVC STL asks for a newer Clang than the image's LLVM, and stops clang-cl with STL1000; the STL's
      # own switch lets it through, as CI has it.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install the Python requirements
        run: python -m pip install -r ps3recomp/requirements.txt pillow numpy

      # The machine keeps the game outside the checkout; setup links it in as vfs\ for the steps that read the folder.
      - name: The game's folder, on this machine
        if: vars.GOWA_GAME_DIR != ''
        shell: bash
        run: python scripts/gowa.py setup --game-dir "$GOWA_GAME_DIR"

      # Without the game there is no package: the Kit's exe and its build check are made from the player's own copy.
      - name: What the package is made from
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "vfs/PS3_GAME/USRDIR/GOWA.elf" ] && [ -z "${GOWA_ELF:-}" ]; then
            echo "::error::No vfs/PS3_GAME/USRDIR/GOWA.elf: run 'gowa.py setup --game-dir ...' and decrypt GOWA.SELF, or set GOWA_ELF. The Kit's package is built from the game's own copy, with the FSR SDK, Streamline, SDL3 and a release FFmpeg."
            exit 1
          fi

      - name: The version, as a tag
        id: tag
        shell: bash
        env:
          RELEASED_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$(sed -n 's/^#define[[:space:]]*AR_VERSION[[:space:]]*"\(.*\)"/\1/p' port/version.h)"
          if [ -z "${tag#v}" ]; then echo "::error::port/version.h has no AR_VERSION"; exit 1; fi
          released="${RELEASED_VERSION#v}"
          if [ -n "$released" ] && [ "v$released" != "$tag" ]; then
            echo "::error::The commit message released $released, but port/version.h says ${tag#v}: the package's name and the release's must be the same."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "$tag"

      # The exe is compiled from the lifter's output, not from anything in the repository: analyze reads GOWA.elf and
      # lift writes recompiled\, spu\ and the headers the build includes. Both folders are the game's own code and are
      # never committed, so a release run makes them every time.
      - name: Lift the game's code
        shell: bash
        run: |
          set -euo pipefail
          python scripts/gowa.py analyze
          python scripts/gowa.py lift

      # The project's own one-click build and package: exe, kit\, licenses, and in dist/<version>/kit the zip,
      # audit.txt, the two maps, FFmpeg's source (which go up) and build-info.txt (which stays here).
      - name: Build and package the Kit
        run: python scripts/gowa.py package kit

      # What the lift was for. The Kit's zip carries this exe; a package that has none is not a release, and this says
      # so here rather than after the upload.
      - name: The executable the build made
        shell: bash
        run: |
          set -euo pipefail
          exe=build-kit/Ascension-R.exe
          if [ ! -f "$exe" ]; then echo "::error::$exe: the build made no executable"; exit 1; fi
          ls -l "$exe"
          sha256sum "$exe"

      - name: A manual run makes its release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is a release already: its files are replaced."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --draft \
            --title "Ascension-R $TAG: God of War: Ascension PC port" --generate-notes

      - name: Put the release's files up
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          dir="dist/${TAG#v}/kit"
          if [ ! -d "$dir" ]; then echo "::error::$dir: the package made nothing"; exit 1; fi
          files=()
          for f in "$dir"/*.zip "$dir"/audit.txt "$dir"/*.map "$dir"/ffmpeg-*.tar.xz; do
            if [ -f "$f" ]; then files+=("$f"); fi
          done
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no files in $dir to upload"; exit 1; fi
          printf '%s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

      # Only now is there something to download: the draft the action made becomes the release.
      - name: The release, with its files
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json tagName,isDraft,assets
