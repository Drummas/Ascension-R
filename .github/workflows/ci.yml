# Runs on every push and pull request. No job needs the game.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: No game files, keys or binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check what is tracked
        run: python3 scripts/check_repo.py

  tests:
    name: Port and lifter tests
    runs-on: windows-latest
    # The image's MSVC STL asks for a newer Clang than the image's LLVM, and stops clang-cl with STL1000; the STL's own
    # switch lets it through. cl and clang-cl both read _CL_. The -D form: bash would turn a leading / into a path.
    env:
      _CL_: -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # The lifters' suites compile and run their cases with cl and clang-cl.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install the Python requirements
        run: python -m pip install -r ps3recomp/requirements.txt pillow numpy

      - name: Port tests
        shell: bash
        run: |
          failed=""; flaky=""
          for t in test_game_find test_game_prepare test_portable_copy test_portable_paths test_dxc_guards \
                   test_gametext test_lang test_kit_paths test_game_module_crt test_game_module_hooks \
                   test_update_check test_kit_files test_optional_mods test_build_jobs test_kit_pgo test_mods \
                   test_modpack test_modtools test_textures test_proportions test_mp_sam test_online_tss \
                   test_mp_play test_mp_node test_mp_dht test_mp_status test_mp_p2p test_mp_nat test_mp_upnp; do
            echo "--- $t"
            if ! python "tests/$t.py"; then
              # The NAT and timing suites can lose a race on a busy runner; a second run says whether it is them or the code.
              if python "tests/$t.py"; then flaky="$flaky $t"; else failed="$failed $t"; fi
            fi
          done
          [ -z "$flaky" ] || echo "note: passed on a second run:$flaky"
          if [ -n "$failed" ]; then echo "::error::port tests failing:$failed"; exit 1; fi

      # The release's launcher compiles with no game and no lift: PORT_GAME_MODULE puts the game's code in the DLL a
      # player's PC builds, and the scaffold is compiled against a ppu_recomp.h with no functions in it, which
      # gowa.py writes from the lifter's own header preamble. This is the exe `gowa.py package kit` publishes.
      #
      # _CL_ is how the rest of this job gets the STL switch in (see the job's env), but clang-cl appends _CL_'s
      # arguments after CMake's "-- <source>", where the driver reads them as more source files and then refuses
      # /Fo: that is the "cannot specify ... when compiling multiple source files" this step used to die on. Passed as
      # a compile flag the switch comes before any header instead, and CMake's own compiler test carries it as well.
      - name: The launcher builds without the game
        shell: bash
        env:
          _CL_: ''
        run: |
          set +e
          clang-cl --version | head -1 | tee launcher-build.log
          python scripts/gowa.py build -D PORT_GAME_MODULE=ON --no-spu \
            -D "CMAKE_C_FLAGS=-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH" \
            -D "CMAKE_CXX_FLAGS=-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH" >> launcher-build.log 2>&1
          rc=$?
          tail -40 launcher-build.log
          if [ $rc -ne 0 ]; then
            # The log is only readable to whoever is signed in; this puts the first errors on the run page itself.
            first=$(grep -m 4 -iE 'error|fatal' launcher-build.log | tr '\n' '|' | cut -c 1-300)
            ctx=$(sed -n '/CMake Error/,$p' launcher-build.log | head -25 | tr '\n' '|' | cut -c 1-1000)
            echo "::error::$(head -1 launcher-build.log) -- $first -- $ctx"
            exit $rc
          fi
          test -f build/Ascension-R.exe
          ls -l build/Ascension-R.exe

      # CI=1: a suite fails rather than skips if no compiler is reachable. The suites in
      # KNOWN_FAILING are red at this commit of the fork: each one is a bug to fix, and
      # any other failure fails the job.
      - name: Lifter tests
        working-directory: ps3recomp
        shell: bash
        env:
          CI: "1"
          KNOWN_FAILING: >-
            test_ppu_jumptable_extent.py
            test_ppu_lift.py
            test_ppu_lifter_chunks.py
            test_spu_lifter_float_spec.py
            test_spu_lifter_insn_patches.py
            test_spu_lifter_shufb_hoist.py
        run: |
          failed=""
          for t in tools/test_*.py; do
            echo "--- $t"
            python "$t" || failed="$failed $(basename "$t")"
          done
          echo "failed:$failed"
          new=""
          for f in $failed; do
            case " $KNOWN_FAILING " in
              *" $f "*) ;;
              *) new="$new $f" ;;
            esac
          done
          if [ -n "$new" ]; then
            echo "new failures:$new"
            exit 1
          fi
